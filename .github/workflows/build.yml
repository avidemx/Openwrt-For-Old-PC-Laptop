name: Fast Build OpenWrt 25.12.5 x86_64 (AMD IXP + Modem)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOLCHAIN_URL: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-toolchain-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  LLVM_URL: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/llvm-bpf-21.1.6.Linux-x86_64.tar.zst"
  OWRT_ARCH: "x86/64"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd pkg-config

      - name: Download & Inject External Toolchain
        run: |
          mkdir -p /opt/toolchain
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.zst
          tar --zstd -xf toolchain.tar.zst -C /opt/toolchain --strip-components=2 --wildcards "*/toolchain-x86_64_gcc-*"
          rm toolchain.tar.zst
          
          # Verifikasi ekstraksi toolchain (Fail-fast)
          test -d /opt/toolchain/bin || { echo "❌ Error: Toolchain extraction failed!"; exit 1; }

          wget -q "$LLVM_URL" -O llvm.tar.zst
          mkdir -p staging_dir
          tar --zstd -xf llvm.tar.zst -C staging_dir/
          rm llvm.tar.zst

      - name: Inject Custom Scripts (Resize & Modem)
        run: |
          mkdir -p files/etc/uci-defaults
          
          cat << "EOF" > files/etc/uci-defaults/70-rootpt-resize
          if [ ! -e /etc/rootpt-resize ] && type parted > /dev/null && lock -n /var/lock/root-resize; then
            ROOT_BLK="$(readlink -f /sys/dev/block/"$(awk -e '$9=="/dev/root"{print $3}' /proc/self/mountinfo)")"
            ROOT_DISK="/dev/$(basename "${ROOT_BLK%/*}")"
            ROOT_PART="${ROOT_BLK##*[^0-9]}"
            parted -f -s "${ROOT_DISK}" resizepart "${ROOT_PART}" 100%
            mount_root done
            touch /etc/rootpt-resize
            if [ -e /boot/cmdline.txt ]; then 
              NEW_UUID=`blkid ${ROOT_DISK}p${ROOT_PART} | sed -n 's/.*PARTUUID="\([^"]*\)".*/\1/p'`
              sed -i "s/PARTUUID=[^ ]*/PARTUUID=${NEW_UUID}/" /boot/cmdline.txt
            fi
            reboot
          fi
          exit 1
          EOF
          
          cat << "EOF" > files/etc/uci-defaults/80-rootfs-resize
          if [ ! -e /etc/rootfs-resize ] && [ -e /etc/rootpt-resize ] && type losetup > /dev/null && type resize2fs > /dev/null && lock -n /var/lock/root-resize; then
            ROOT_BLK="$(readlink -f /sys/dev/block/"$(awk -e '$9=="/dev/root"{print $3}' /proc/self/mountinfo)")"
            ROOT_DEV="/dev/${ROOT_BLK##*/}"
            LOOP_DEV="$(awk -e '$5=="/overlay"{print $9}' /proc/self/mountinfo)"
            if [ -z "${LOOP_DEV}" ]; then
              LOOP_DEV="$(losetup -f)"
              losetup "${LOOP_DEV}" "${ROOT_DEV}"
            fi
            resize2fs -f "${LOOP_DEV}"
            mount_root done
            touch /etc/rootfs-resize
            reboot
          fi
          exit 1
          EOF
          
          cat << "EOF" >> files/etc/sysupgrade.conf
          /etc/uci-defaults/70-rootpt-resize
          /etc/uci-defaults/80-rootfs-resize
          EOF

          cat << "EOF" > files/etc/uci-defaults/99-custom-config
          uci set system.@system[0].timezone='WIB-7'
          uci set system.@system[0].zonename='Asia/Jakarta'
          uci commit system
          
          uci set network.lan.ipaddr='192.168.10.1/24'
          
          uci -q delete network.Dell_DW5821e
          uci set network.Dell_DW5821e='interface'
          uci set network.Dell_DW5821e.proto='modemmanager'
          uci set network.Dell_DW5821e.force_link='1'
          uci set network.Dell_DW5821e.apn='internet'
          uci add_list network.Dell_DW5821e.allowedauth='none'
          uci set network.Dell_DW5821e.iptype='ipv4'
          uci set network.Dell_DW5821e.loglevel='ERR'

          uci -q delete network.modem
          uci set network.modem='interface'
          uci set network.modem.proto='none'
          uci set network.modem.device='wwan0'
          uci set network.modem.force_link='1'
          
          uci set network.usbwan="interface"
          uci set network.usbwan.ifname="usb0"
          uci set network.usbwan.proto="dhcp"
          uci commit network

          uci set wireless.@wifi-device[0].disabled="0"
          uci set wireless.@wifi-device[0].channel="11"
          uci set wireless.@wifi-device[0].htmode="HT20"
          uci set wireless.@wifi-iface[0].disabled="0"
          uci set wireless.@wifi-iface[0].ssid="Linksys"
          uci set wireless.@wifi-iface[0].key="12345678"
          uci set wireless.@wifi-iface[0].encryption="none"
          uci commit wireless

          WAN_IDX=$(uci show firewall | grep -F ".name='wan'" | cut -d. -f2 | cut -d= -f1)
          uci add_list firewall.${WAN_IDX}.network="usbwan"
          uci add_list firewall.${WAN_IDX}.network="Dell_DW5821e"
          uci commit firewall
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/*

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch Kernel Config Safely (Built-in AMD IXP)
        run: |
          echo "Patching generic x86 kernel configuration..."
          
          for f in target/linux/x86/config-*; do
            [ -f "$f" ] || continue
            echo "Membersihkan nilai lama di $f..."
            
            sed -i '/CONFIG_ATA=/d' "$f"
            sed -i '/CONFIG_ATA_SFF=/d' "$f"
            sed -i '/CONFIG_ATA_BMDMA=/d' "$f"
            sed -i '/CONFIG_PATA_ATIIXP/d' "$f"
            sed -i '/CONFIG_ATA_PIIX/d' "$f"
            sed -i '/CONFIG_SATA_SIL/d' "$f"

            echo "Menyuntikkan konfigurasi Built-in..."
            cat >> "$f" <<EOF
          CONFIG_ATA=y
          CONFIG_ATA_SFF=y
          CONFIG_ATA_BMDMA=y
          CONFIG_PATA_ATIIXP=y
          CONFIG_ATA_PIIX=y
          CONFIG_SATA_SIL=y
          EOF
          done

      - name: Generate .config & Evaluate Toolchain
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/config.buildinfo -O .config
          
          sed -i '/CONFIG_ALL_KMODS=y/d; /CONFIG_ALL_NONSHARED=y/d; /CONFIG_IB=y/d; /CONFIG_SDK=y/d; /CONFIG_SDK_LLVM_BPF=y/d; /CONFIG_MAKE_TOOLCHAIN=y/d; /CONFIG_BUILDBOT=y/d' .config
          
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          
          PACKAGES="kmod-usb-net-rtl8152 kmod-r8169 kmod-rtl8192se kmod-usb-ohci kmod-usb-ehci-pci kmod-usb2 kmod-pci kmod-i2c-piix4 kmod-ohci-pci kmod-ehci-pci kmod-k8temp kmod-radeon kmod-drm-radeon kmod-yenta-cardbus kmod-pcmcia-yenta kmod-firewire-ohci kmod-firewire-core kmod-tifm-7xx1 kmod-tifm-core kmod-sdhci-pci kmod-sdhci kmod-sound-hda-intel modemmanager modemmanager-rpcd libmbim libqmi luci-proto-modemmanager kmod-usb-serial-option kmod-usb-net-cdc-mbim umbim kmod-usb-acm kmod-usb-wdm kmod-usb-net-rndis parted losetup resize2fs blkid"
          
          for pkg in $PACKAGES; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          
          ./scripts/ext-toolchain.sh --toolchain /opt/toolchain --overwrite-config --config $OWRT_ARCH
          make defconfig
          
          echo "--- Diffconfig (Perbedaan dari Default) ---"
          ./scripts/diffconfig.sh

      - name: Prepare Kernel
        run: |
          make target/linux/prepare V=s

      - name: Diagnostic - Inspect Build Environment
        run: |
          echo "===== staging_dir ====="
          find staging_dir -name '*config*' | sort || true

          echo "===== build_dir (Directories) ====="
          find build_dir -maxdepth 4 -type d | sort || true
          
          echo "===== build_dir (Config Files) ====="
          find build_dir -name '.config' | sort || true

          echo "===== tmp ====="
          find tmp -maxdepth 3 | sort || true
          find tmp -name '*config*' | sort || true

      - name: Download Packages
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Verify AMD IXP Driver (Post-Compile Final Kernel Check)
        run: |
          echo "Mencari file .config kernel di dalam direktori build_dir setelah kompilasi..."
          
          # Pencarian kebal nama folder
          KERNEL_CONFIG_FILE=$(find build_dir -type f -name ".config" | grep "/linux-" | head -n 1)
          
          if [ -z "$KERNEL_CONFIG_FILE" ]; then
            echo "❌ Error: File .config kernel tetap tidak ditemukan bahkan setelah proses compile selesai!"
            exit 1
          fi
          
          echo "✅ Ditemukan file konfigurasi Kernel final di: $KERNEL_CONFIG_FILE"
          echo "Memverifikasi opsi Kernel bawaan (Built-in)..."
          
          for opt in CONFIG_ATA CONFIG_ATA_SFF CONFIG_ATA_BMDMA CONFIG_PATA_ATIIXP CONFIG_ATA_PIIX CONFIG_SATA_SIL; do
              grep -q "^${opt}=y$" "$KERNEL_CONFIG_FILE" || {
                  echo "❌ GAGAL: Setelan kernel '$opt' tidak ditemukan atau bukan =y!"
                  echo "Isi file terkait '$opt' saat ini:"
                  grep "$opt" "$KERNEL_CONFIG_FILE" || echo "(Tidak ada satupun baris yang cocok)"
                  exit 1
              }
          done
          echo "✅ VERIFIKASI SUKSES: Semua sub-sistem ATA/PATA dipastikan tertanam ke dalam inti Kernel!"
          
      - name: Download Packages
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=v25.12.5-x86-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_name=OpenWrt 25.12.5 x86_64 (Native Boot AMD IXP) $(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_name }}
          files: |
            bin/targets/x86/64/*squashfs-combined.img.gz
            bin/targets/x86/64/*squashfs-combined-efi.img.gz
            bin/targets/x86/64/*ext4-combined.img.gz
            bin/targets/x86/64/*ext4-combined-efi.img.gz
            bin/targets/x86/64/sha256sums
