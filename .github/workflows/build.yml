name: Build OpenWrt 25.12.5 x86_64 (AMD IXP SB4x0)

on:
  workflow_dispatch: # Tidak ada isian/input, tinggal klik "Run workflow"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget zstd

      - name: Checkout OpenWrt 25.12.5
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5 # Mengacu pada rilis spesifik 25.12.5

      - name: Download & Extract Pre-compiled Toolchain & LLVM
        run: |
          # Mengunduh toolchain dan LLVM dari URL yang diberikan
          wget https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-toolchain-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          wget https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/llvm-bpf-21.1.6.Linux-x86_64.tar.zst
          
          # Mengekstrak arsip langsung ke direktori root OpenWrt. 
          # Ini akan otomatis mengisi folder staging_dir/, sehingga OpenWrt akan mendeteksinya 
          # dan melewati (skip) proses kompilasi GCC dan LLVM yang memakan waktu lama.
          tar --zstd -xf openwrt-toolchain-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf llvm-bpf-21.1.6.Linux-x86_64.tar.zst

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch Kernel Config (AMD IXP SB4x0)
        run: |
          # Berdasarkan URL kmods Anda, versi kernel target adalah 6.12
          KERNEL_CONFIG="target/linux/x86/config-6.12"
          
          echo "Menambahkan konfigurasi driver PATA/SATA jadul ke $KERNEL_CONFIG"
          
          echo "CONFIG_ATA=y" >> $KERNEL_CONFIG
          echo "CONFIG_ATA_SFF=y" >> $KERNEL_CONFIG
          echo "CONFIG_PATA_ATIIXP=m" >> $KERNEL_CONFIG
          echo "CONFIG_ATA_PIIX=m" >> $KERNEL_CONFIG
          echo "CONFIG_SATA_SIL=m" >> $KERNEL_CONFIG

      - name: Generate .config
        run: |
          # Menentukan target arsitektur
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          
          # Meminta OpenWrt membuat package kmod untuk driver yang sudah dipatch di kernel
          echo "CONFIG_PACKAGE_kmod-ata-core=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ata-piix=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ata-sil=y" >> .config
          echo "CONFIG_PACKAGE_kmod-pata-atiixp=y" >> .config
          
          # Memvalidasi konfigurasi
          make defconfig

      - name: Download Package Sources
        run: make download -j8

      - name: Compile Firmware & Kernel Modules
        run: |
          # Menggunakan seluruh core yang tersedia pada runner GitHub Actions
          make -j$(nproc) V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-x86_64-amd-ixp
          path: bin/targets/x86/64/
          retention-days: 7